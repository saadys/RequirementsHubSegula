services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - app-data:/app/data
      - ./backend:/app/backend    # Hot reload during dev
    restart: unless-stopped

