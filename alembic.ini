# alembic.ini — Alembic configuration for RequirementsHub
# Located at project root. Run: alembic upgrade head

[alembic]
# Path to the migrations directory (co-located with DB definition)
script_location = backend/models/db_schemes/requirementshub/alembic

# sqlalchemy.url is overridden in env.py from backend.config.DATABASE_URL
# Do NOT hardcode credentials here
sqlalchemy.url =

# Prepend sys.path so `backend` package is importable by env.py
prepend_sys_path = .

# Migration file naming: timestamp + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC


[post_write_hooks]
# Optional: run black formatter on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
