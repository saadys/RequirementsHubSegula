[project]
name = "ai-requirement-hub"
version = "0.1.0"
description = "AI-powered intermediary tool between business teams and the AI team at Segula Technologies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    # LLM Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.2.0",
    "litellm>=1.40.0",
    # Structured Output
    "pydantic>=2.7.0",
    # RAG (pgvector replaces ChromaDB for stateless Cloud Run deployments)
    "pgvector>=0.3.0",
    "google-genai>=1.0.0",
    # File Parsing
    "pdfplumber>=0.11.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Database (PostgreSQL async via SQLAlchemy 2.0 + asyncpg driver)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    # Utils
    "python-dotenv>=1.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
